[project]
name = "scholar-agent"
version = "0.1.0"
description = "Paper Intelligence Agent — Automated research paper collection, multimodal subagent analysis, highlighted PDF generation, and cross-runtime orchestration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
]

[project.scripts]
scholar-agent = "scholar_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
