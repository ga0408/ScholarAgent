# Agent Runtime & Model Routing Configuration
# Supported runtimes: antigravity (agy), claude, codex

defaults:
  primary_runtime: antigravity
  fallback_runtime: claude
  max_concurrent_runs: 3
  timeout_seconds: 300

roles:
  # Fast Abstract screening & metadata tagging
  triage:
    primary: antigravity
    model: claude-opus-5-5-medium
    effort: medium

  # Deep architectural & mathematical analysis
  method_deep_dive:
    primary: antigravity
    fallback: claude
    model: claude-opus-5-5-high
    effort: high

  # Multimodal equation analysis (text + rendered page PNGs)
  equation_explainer:
    primary: antigravity
    fallback: claude
    model: ""
    effort: medium

  # Multimodal figure & benchmark table analysis (text + page/figure PNGs)
  figure_table:
    primary: antigravity
    fallback: claude
    model: ""
    effort: medium

  # Limitations, practical takeaways, follow-up ideas
  critical_review:
    primary: antigravity
    fallback: claude
    model: ""
    effort: medium

  # Verbatim quote selection for PDF highlighting
  highlight_selector:
    primary: antigravity
    fallback: claude
    model: ""
    effort: medium

  # Final bilingual structured report synthesis
  synthesis:
    primary: antigravity
    fallback: claude
    model: claude-opus-5-5-high
    effort: high

  # Multi-paper comparison & discussion
  comparison:
    primary: antigravity
    fallback: claude
    model: ""
    effort: high

  discussion:
    primary: antigravity
    fallback: claude
    model: ""
    effort: medium
