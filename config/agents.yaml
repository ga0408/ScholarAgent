# Agent Runtime & Model Routing Configuration
# Supported runtimes: antigravity (agy), claude, codex

defaults:
  primary_runtime: antigravity
  fallback_runtime: claude
  timeout_seconds: 360

user_profile:
  preferred_language: ko
  research_interests:
    - "LLM Efficiency, Long-Context, Attention & KV Cache Compression"
    - "External Knowledge Augmentation, RAG & Long-Term Agent Memory"
    - "Multimodal Document Understanding & Agentic Architectures"

roles:
  # Batch Hugging Face Daily Papers abstract screening & fast tool triage
  daily_triage:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-low
    effort: low

  # Single-paper abstract + intro + heading triage & section mapping
  triage:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-medium
    effort: medium

  # Core structured section skeleton (Intro, Related Works, Overview)
  core_summary:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-medium
    effort: medium

  # Deep architectural & mathematical analysis (multimodal)
  method_deep_dive:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-high
    effort: high

  # Multimodal equation analysis (text + rendered page PNGs)
  equation_explainer:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-medium
    effort: medium

  # Multimodal figure & benchmark table analysis (text + page/figure PNGs)
  figure_table:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-medium
    effort: medium

  # Limitations, practical takeaways, methodological critique
  critical_review:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-high
    effort: high

  # Verbatim quote selection for PDF highlighting
  highlight_selector:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-medium
    effort: medium

  # Final bilingual structured report synthesis
  synthesis:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-high
    effort: high

  # Multi-paper comparison & discussion
  comparison:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-high
    effort: high

  discussion:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-medium
    effort: medium

  # Presentation slide deck & spoken script planner
  presentation_planner:
    primary: antigravity
    fallback: claude
    model: gemini-4-hydrogen-medium
    effort: medium
